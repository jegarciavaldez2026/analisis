server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El frontend hace peticiones a /api/... relativas, asi que el mismo
    # origen sirve la app y la API. Sin CORS, y funciona igual detras de
    # Traefik, Nginx Proxy Manager, Cloudflare Tunnel o por IP en la LAN.

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm font/woff font/woff2;

    # --- API -> backend FastAPI ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte websockets por si se añaden streams en el futuro
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Los analisis con yfinance y el LLM local pueden tardar.
        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        proxy_buffering off;
    }

    # Docs de FastAPI accesibles para depurar
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Assets estaticos con hash: cache agresiva ---
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- Rutas de expo-router (output: static genera un .html por ruta) ---
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
    }

    # Endpoint de salud del propio contenedor web
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

services:
  mongo:
    image: mongo:7.0
    container_name: analisis_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: analisis_db
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - analisis_net
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: analisis_backend
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017/analisis_db
      DB_NAME: analisis_db
      SECRET_KEY: finanalysis-jwt-secret-2026-change-me
    networks:
      - analisis_net
    depends_on:
      - mongo
volumes:
  mongo_data:
networks:
  analisis_net:
    driver: bridge
